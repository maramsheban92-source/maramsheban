        let currentQuestion = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let score = 0;

        function loadQuestion() {
            const question = quizData[currentQuestion];
            const container = document.getElementById('quiz-container');
            
            container.innerHTML = `
                <div class="question-container">
                    <div class="question-number">Question ${currentQuestion + 1} of ${quizData.length}</div>
                    <div class="question-text">${question.question}</div>
                    <div class="options">
                        ${question.options.map((option, index) => `
                            <label class="option ${userAnswers[currentQuestion] === index ? 'selected' : ''}">
                                <input type="radio" name="answer" value="${index}" 
                                    ${userAnswers[currentQuestion] === index ? 'checked' : ''}
                                    onchange="selectAnswer(${index})">
                                <span>${option}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>
            `;

            updateNavigation();
            updateProgress();
        }

        function selectAnswer(answerIndex) {
            userAnswers[currentQuestion] = answerIndex;
            
            // Update visual selection
            const options = document.querySelectorAll('.option');
            options.forEach((option, index) => {
                if (index === answerIndex) {
                    option.classList.add('selected');
                } else {
                    option.classList.remove('selected');
                }
            });
            
            updateProgress();
        }

        function nextQuestion() {
            if (currentQuestion < quizData.length - 1) {
                currentQuestion++;
                loadQuestion();
            }
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        function updateNavigation() {
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const submitBtn = document.getElementById('submit-btn');

            prevBtn.disabled = currentQuestion === 0;
            
            if (currentQuestion === quizData.length - 1) {
                nextBtn.classList.add('hidden');
                submitBtn.classList.remove('hidden');
            } else {
                nextBtn.classList.remove('hidden');
                submitBtn.classList.add('hidden');
            }
        }

        function updateProgress() {
            const answered = userAnswers.filter(answer => answer !== null).length;
            const progress = (currentQuestion / quizData.length) * 100;
            
            document.getElementById('current-question').textContent = currentQuestion + 1;
            document.getElementById('answered').textContent = answered;
            document.getElementById('progress-fill').style.width = progress + '%';
        }

        function submitQuiz() {
            if (userAnswers.includes(null)) {
                const unanswered = userAnswers.filter(a => a === null).length;
                if (!confirm(`You have ${unanswered} unanswered questions. Do you want to submit anyway?`)) {
                    return;
                }
            }

            score = 0;
            userAnswers.forEach((answer, index) => {
                if (answer === quizData[index].correct) {
                    score++;
                }
            });

            showResults();
        }

        function showResults() {
            const percentage = (score / quizData.length * 100).toFixed(1);
            let feedback = '';
            
            if (percentage >= 90) {
                feedback = '🏆 Outstanding! You have excellent knowledge of biochemistry!';
            } else if (percentage >= 80) {
                feedback = '🌟 Great job! You have a strong understanding of biochemistry!';
            } else if (percentage >= 70) {
                feedback = '👍 Good work! You have a solid grasp of the concepts!';
            } else if (percentage >= 60) {
                feedback = '📚 Not bad! Keep studying to improve your knowledge!';
            } else {
                feedback = '💪 Keep learning! Review the material and try again!';
            }

            const resultsHTML = `
                <h2>Quiz Complete!</h2>
                <div class="score">${score} / ${quizData.length}</div>
                <div class="performance">${percentage}%</div>
                <div class="feedback">${feedback}</div>
                <button class="btn btn-primary" onclick="reviewAnswers()">Review Answers</button>
                <button class="btn btn-secondary" onclick="restartQuiz()">Restart Quiz</button>
            `;

            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('quiz-info').classList.add('hidden');
            document.querySelector('.progress-bar').classList.add('hidden');
            document.querySelector('.navigation').classList.add('hidden');
            
            const resultsContainer = document.getElementById('results-container');
            resultsContainer.innerHTML = resultsHTML;
            resultsContainer.classList.remove('hidden');
        }

        function reviewAnswers() {
            const reviewHTML = quizData.map((question, index) => {
                const userAnswer = userAnswers[index];
                const isCorrect = userAnswer === question.correct;
                
                return `
                    <div class="question-container">
                        <div class="question-number">
                            Question ${index + 1} 
                            ${isCorrect ? '✅ Correct' : '❌ Incorrect'}
                        </div>
                        <div class="question-text">${question.question}</div>
                        <div class="options">
                            ${question.options.map((option, optIndex) => {
                                let className = 'option';
                                if (optIndex === question.correct) {
                                    className += ' correct';
                                } else if (optIndex === userAnswer && !isCorrect) {
                                    className += ' incorrect';
                                }
                                return `
                                    <div class="${className}">
                                        <span>${option}</span>
                                        ${optIndex === question.correct ? ' ✓' : ''}
                                        ${optIndex === userAnswer && !isCorrect ? ' (Your answer)' : ''}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('results-container').classList.add('hidden');
            document.getElementById('quiz-container').innerHTML = reviewHTML;
            document.getElementById('quiz-container').classList.remove('hidden');
            
            const navigation = document.querySelector('.navigation');
            navigation.innerHTML = '<button class="btn btn-secondary" onclick="restartQuiz()">Restart Quiz</button>';
            navigation.classList.remove('hidden');
        }

        function restartQuiz() {
            currentQuestion = 0;
            userAnswers = new Array(quizData.length).fill(null);
            score = 0;
            
            document.getElementById('quiz-info').classList.remove('hidden');
            document.querySelector('.progress-bar').classList.remove('hidden');
            document.getElementById('results-container').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            
            const navigation = document.querySelector('.navigation');
            navigation.innerHTML = `
                <button class="btn btn-secondary" id="prev-btn" onclick="previousQuestion()" disabled>← Previous</button>
                <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()">Next →</button>
                <button class="btn btn-success hidden" id="submit-btn" onclick="submitQuiz()">Submit Quiz</button>
            `;
            
            loadQuestion();
        }

        // Initialize quiz on page load
        window.onload = function() {
            loadQuestion();
        };
    </script>
